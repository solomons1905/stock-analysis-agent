# Stock Analysis Agent - configuration

# Which markets to analyse
markets:
  israel:
    enabled: true
    exchange: "TASE"
  usa:
    enabled: true
    exchanges: ["NASDAQ", "NYSE"]

# How much each dimension contributes to the final 0-100 score.
# The three weights are normalised automatically if they do not sum to 1.
scoring:
  technical_weight: 0.40
  fundamental_weight: 0.35
  sentiment_weight: 0.25

# Risk management applied to BUY recommendations.
# STRONG BUY signals use a tighter 2% stop and a 20% target.
risk:
  default_stop_loss_percent: 3.0
  default_take_profit_percent: 15.0
  max_allocation_per_stock: 5.0

# Score thresholds, for reference. The mapping lives in src/recommender.py.
#   80-100  STRONG BUY
#   65-79   BUY
#   50-64   HOLD
#   35-49   SELL
#    0-34   STRONG SELL

# When the analysis runs. The schedule itself is set by the cron expression
# in .github/workflows/daily_analysis.yml; this is documentation.
schedule:
  run_time: "14:00"
  timezone: "Asia/Jerusalem"

notifications:
  telegram:
    enabled: true
  reports:
    save_to_file: true
    file_path: "reports"
